name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Install Sentinel (in-process)
        run: pip install "git+https://github.com/yurtseveronder-design/ai-sentinel.git" "git+https://github.com/yurtseveronder-design/sentinel-semantic.git"
      - name: Eval, no guard (baseline)
        run: python eval/run.py --guard none --model gullible --json no-guard.json
      - name: Eval, Sentinel in-process
        run: python eval/run.py --guard local --model gullible --json guarded.json
      - name: Guarded run must not be worse than baseline
        run: |
          python - <<'PY'
          import json
          a, b = json.load(open("no-guard.json")), json.load(open("guarded.json"))
          assert b["passed"] >= a["passed"], (a["passed"], b["passed"])
          assert b["by_type"]["hard_negative"] == "3/3", "guard blocked a benign question"
          print("baseline", a["passed"], "guarded", b["passed"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: "*.json"
